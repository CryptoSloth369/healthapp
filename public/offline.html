<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Health</title>
<style>
  :root { color-scheme: light dark; --bg:#0b0d10; --fg:#e8eaed; --muted:#9aa1ab; --accent:#34d399; --accent-fg:#052e1f; --card:#15181d; --border:#262b33; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#15181d; --muted:#5f6672; --accent:#059669; --accent-fg:#fff; --card:#fff; --border:#e2e5ea; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:22rem; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:center; }
  h1 { font-size:1.25rem; margin:12px 0 4px; }
  p { color:var(--muted); margin:0 0 16px; }
  button { background:var(--accent); color:var(--accent-fg); border:0; border-radius:12px; padding:10px 18px; font-weight:600; font-size:16px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="56" height="56" style="border-radius:12px">
  <h1>You're offline</h1>
  <p>This page hasn't been saved on this device yet. Pages you've opened before still work offline, and anything you log while the app is open saves once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
